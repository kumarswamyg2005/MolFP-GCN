[theme]
base = "light"
primaryColor = "#2F6FB0"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2321"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
showEmailPrompt = false  # first-run prompt blocks `make demo` on a fresh machine
